<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cumhur</title>
  <meta name="description" content="The official website of Cumhur.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111111;
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 32px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: #111111;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      min-height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      padding: 0 6%;
    }

    .hero {
      max-width: 900px;
    }

    .eyebrow {
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 24px;
      color: #666666;
    }

    h1 {
      font-size: clamp(64px, 12vw, 160px);
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-weight: 700;
    }

    .intro {
      margin-top: 32px;
      font-size: clamp(20px, 2.5vw, 30px);
      line-height: 1.4;
      max-width: 700px;
      color: #444444;
    }

    .links {
      display: flex;
      gap: 28px;
      margin-top: 44px;
      flex-wrap: wrap;
    }

    .links a {
      color: #111111;
      text-decoration: none;
      font-size: 15px;
      border-bottom: 1px solid #111111;
      padding-bottom: 4px;
    }

    @media (max-width: 700px) {
      header {
        padding: 24px;
      }

      nav {
        display: none;
      }

      main {
        padding: 0 24px;
      }

      h1 {
        font-size: clamp(64px, 22vw, 100px);
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">IAMCUMHUR</div>

    <nav>
      <a href="#">Projects</a>
      <a href="#">Books</a>
      <a href="#">Journal</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">

      <div class="eyebrow">
        Author · Creator · Builder
      </div>

      <h1>CUMHUR</h1>

      <p class="intro">
        Ideas, stories and projects about reality,
        identity and human life.
      </p>

      <div class="links">
        <a href="#">Explore Projects</a>
        <a href="#">Books</a>
      </div>

    </section>
  </main>

</body>
</html>
